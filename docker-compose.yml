name: indrive_light

services:
  postgres:
    image: postgres:16
    container_name: indrive-postgres
    environment:
      POSTGRES_DB: indrive_db
      POSTGRES_USER: indrive
      POSTGRES_PASSWORD: indrive
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indrive -d indrive_db"]
      interval: 3s
      retries: 20

  adminer:
    image: adminer
    container_name: indrive-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on: [postgres]
    ports:
      - "8085:8080"

  airflow:
    image: apache/airflow:2.9.3
    container_name: indrive-airflow
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"          # évite les erreurs de permission sous Linux
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW_CONN_POSTGRES_DEFAULT: "postgresql://indrive:indrive@postgres:5432/indrive_db"
      PG_HOST: postgres
      PG_DB: indrive_db
      PG_USER: indrive
      PG_PASSWORD: indrive
      VERIFY_SSL: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
    ports:
      - "8081:8080"